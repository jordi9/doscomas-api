name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: jordi9/actions/calver@v1
        id: version

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build installDist

      - uses: orhun/git-cliff-action@v4
        id: notes
        with:
          args: ${{ steps.version.outputs.previous }}..HEAD

      - uses: jordi9/actions/gh-release@v1
        with:
          version: ${{ steps.version.outputs.version_tag }}
          body: ${{ steps.notes.outputs.content }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

      - name: Build and push image
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
        run: |
          IMAGE="ghcr.io/${OWNER}/doscomas"
          docker build --build-arg APP_VERSION="$VERSION" -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          echo "Released $VERSION_TAG"
          echo "Image: $IMAGE:$VERSION"
